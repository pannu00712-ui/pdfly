  <script>
    let workbook = null, srcFile = null;
    const dropZone = document.getElementById('dropZone'), fileInput = document.getElementById('fileInput');
    setupDropZone(dropZone, fileInput, handleFile, { accept: '.xlsx,.xls,.csv' });

    async function handleFile(files) {
      const f = files.find(f => /\.(xlsx|xls|csv)$/i.test(f.name));
      if (!f) { showToast('Please select an Excel or CSV file', 'error'); return; }
      srcFile = f;
      const ab = await readFileAsArrayBuffer(f);
      workbook = XLSX.read(ab, { type: 'array' });
      document.getElementById('fileName').textContent = f.name;
      document.getElementById('fileDetails').textContent = `${formatSize(f.size)} · ${workbook.SheetNames.length} sheet(s)`;
      const sel = document.getElementById('sheetSelect');
      sel.innerHTML = workbook.SheetNames.map(n => `<option value="${n}">${n}</option>`).join('');
      ['fileInfo','convertOptions','convertBtn'].forEach(id => document.getElementById(id).classList.remove('hidden'));
      document.getElementById('result').classList.add('hidden');
    }

    function clearFile() {
      workbook = null; srcFile = null;
      ['fileInfo','convertOptions','convertBtn','result'].forEach(id => document.getElementById(id).classList.add('hidden'));
    }

    async function convertToPDF() {
      if (!workbook) return;
      const btn = document.getElementById('convertBtn'); setLoading(btn, true);
      try {
        const sheetName = document.getElementById('sheetSelect').value;
        const sheet = workbook.Sheets[sheetName];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
        const orient = document.getElementById('orientation').value;
        const { PDFDocument, StandardFonts, rgb } = PDFLib;
        const pdf = await PDFDocument.create();
        const font = await pdf.embedFont(StandardFonts.Helvetica);
        const fontBold = await pdf.embedFont(StandardFonts.HelveticaBold);

        const [pageW, pageH] = orient === 'landscape' ? [841.89, 595.28] : [595.28, 841.89];
        const margin = 30, fontSize = 8, rowH = 18;
        const numCols = Math.max(1, ...rows.map(r => r.length));
        const colW = (pageW - margin * 2) / numCols;

        let page = pdf.addPage([pageW, pageH]);
        let y = pageH - margin;

        rows.forEach((row, rIdx) => {
          if (y < margin + rowH) { page = pdf.addPage([pageW, pageH]); y = pageH - margin; }
          const isHeader = rIdx === 0;
          if (isHeader) page.drawRectangle({ x: margin, y: y - rowH, width: pageW - margin * 2, height: rowH, color: rgb(0.97, 0.45, 0.09), opacity: 0.15 });
          for (let c = 0; c < numCols; c++) {
            const val = row[c] !== undefined ? String(row[c]) : '';
            const text = val.length > 40 ? val.slice(0, 37) + '…' : val;
            page.drawText(text, {
              x: margin + c * colW + 4,
              y: y - rowH + 5,
              size: fontSize,
              font: isHeader ? fontBold : font,
              color: rgb(0.11, 0.1, 0.09),
              maxWidth: colW - 8
            });
          }
          page.drawLine({ start: { x: margin, y: y - rowH }, end: { x: pageW - margin, y: y - rowH }, thickness: 0.5, color: rgb(0.85, 0.83, 0.8) });
          y -= rowH;
        });

        const bytes = await pdf.save();
        const blob = new Blob([bytes], { type: 'application/pdf' });
        const name = (document.getElementById('outputName').value.trim() || 'spreadsheet') + '.pdf';
        document.getElementById('resultInfo').textContent = `${rows.length} rows · ${formatSize(blob.size)}`;
        document.getElementById('result').classList.remove('hidden');
        document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'center' });
        document.getElementById('downloadBtn').onclick = () => { downloadBlob(blob, name); showToast('PDF downloaded!'); };
        showToast('Converted to PDF successfully!');
      } catch (e) { console.error(e); showToast('Conversion failed', 'error'); }
      finally { setLoading(btn, false); }
    }
  </script>
